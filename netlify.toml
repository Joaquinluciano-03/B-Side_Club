# Todo el proyecto en un solo deploy de Netlify:
#   - el frontend compilado (Vite) se publica como sitio estatico
#   - el backend (Express) corre como una funcion, en /api/*
#
# Las imagenes NO se guardan acá: una funcion no tiene disco propio, asi que
# van a Supabase Storage (ver src/config/storage.js).

[build]
  # el repo tiene el backend en la raiz y el frontend en /frontend, asi que
  # hay que instalar las dependencias de los dos
  command = "npm install && npx prisma generate && npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # esbuild sigue los require() y arma el bundle de la funcion
  node_bundler = "esbuild"
  # Prisma 7 con driver adapters no usa un binario nativo, pero si necesita el
  # .wasm del compilador de queries y el schema: esbuild no los detecta solo
  # porque no se cargan con un require()
  included_files = [
    "node_modules/.prisma/client/*.wasm",
    "node_modules/.prisma/client/schema.prisma",
    "prisma/schema.prisma"
  ]

# /api/* lo atiende el backend. Va ANTES del catch-all del SPA, porque las
# reglas se evaluan en orden y si no el index.html se comeria la API.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# React Router maneja las rutas del lado del cliente: el server tiene que
# devolver index.html para cualquier otro path. Sin esto, entrar directo a
# /catalogo o apretar F5 ahi da 404, porque ese archivo no existe en disco.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# helmet pone los headers de las respuestas de la API; estos son para los
# archivos estaticos del sitio, que no pasan por Express.
#
# Content-Security-Policy: le dice al navegador de donde puede cargar cosas el
# sitio. Si alguien lograra meter codigo en la pagina, no podria traer
# scripts de otro lado ni mandar datos afuera.
#   - script-src: solo nuestros archivos y el script chico de index.html,
#     habilitado por su hash (si se cambia ese script, recalcular el hash:
#     sha256 en base64 del texto que queda entre <script> y </script>)
#   - img-src: las fotos viven en Supabase Storage. Va el comodin
#     *.supabase.co y no la direccion del proyecto, que es secreta en Netlify
#     (el build falla si aparece en el codigo). blob: es la vista previa de
#     las fotos elegidas en el panel antes de subirlas
#   - connect-src 'self': la API esta en el mismo dominio (/api)
#   - style-src 'unsafe-inline': React y motion ponen estilos en linea
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-QYktQWD6M+cubam+/FoEiKThvlsPGH3bKTBp84xDBKQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite le pone un hash al nombre de cada archivo: si el contenido cambia,
    # cambia la URL, asi que se pueden cachear para siempre sin riesgo
    Cache-Control = "public, max-age=31536000, immutable"
