<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- logo.png pesa 1,6 MB: el favicon y el resto usan versiones livianas -->
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#100f0e" />
    <meta
      name="description"
      content="B-Side Club, disquería. Vinilos, cassettes, CDs y equipos de audio, nuevos o usados con garantía de calidad."
    />
    <!-- titulo y descripcion de respaldo: al cargar, el sitio los reemplaza por
         los de la base (nombre y barrio del local, ver useMetadatosDelLocal) -->
    <title>B-Side Club · Disquería</title>

    <!-- vista previa al compartir el link (WhatsApp, Instagram, etc) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="B-Side Club" />
    <meta property="og:title" content="B-Side Club · Disquería" />
    <meta
      property="og:description"
      content="Vinilos, cassettes, CDs y equipos de audio, nuevos o usados con garantía de calidad."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- las fuentes se autohospedan desde src/main.jsx (@fontsource); las del
         neon se precargan desde vite.config.js (precargarFuentes) -->

    <!-- carga mas rapida: el sitio es una SPA, asi que sin esto el navegador
         recien descubre estos archivos cuando termina de bajar y correr el JS.
         El dibujo del disco es lo mas grande de la primera pantalla, pero
         solo lo tienen la home y el login; en las otras paginas precargarlo
         seria bajarlo de mas (y el navegador avisa que no se uso).
         La direccion de Supabase no se escribe aca: SUPABASE_URL esta marcada
         como secreta en Netlify y el build falla si aparece en el codigo. -->
    <!-- en una sola linea a proposito: la Content-Security-Policy de
         netlify.toml lo habilita por su hash, y con saltos de linea el hash
         cambiaria segun la maquina (CRLF en Windows, LF en el repo). Si se
         toca, hay que recalcular el hash (ver netlify.toml). -->
    <script>if(location.pathname==="/"||location.pathname==="/login"){for(const a of["/surcos.svg","/imperfecciones.svg"]){const l=document.createElement("link");l.rel="preload";l.as="image";l.href=a;document.head.appendChild(l)}}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
