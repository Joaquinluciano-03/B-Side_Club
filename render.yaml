# Deploy del BACKEND en Render. El frontend va aparte, en Netlify
# (ver netlify.toml).
#
# Las variables marcadas sync:false NO se escriben acá: se cargan a mano en
# el panel de Render, porque son secretas y este archivo esta en el repo.

services:
  - type: web
    name: bside-club-api
    runtime: node
    plan: free
    region: oregon

    # prisma generate es obligatorio: el cliente no viene generado en el repo,
    # se arma a partir de prisma/schema.prisma en cada build
    buildCommand: npm install && npx prisma generate
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_KEY
        sync: false

      - key: JWT_EXPIRES_IN
        value: 7d

      # dominio del frontend: sin esto el navegador bloquea todos los pedidos
      - key: CORS_ORIGINS
        value: https://bside-club.netlify.app

      # arma los links de invitacion y de recuperar contraseña que van por mail
      - key: FRONTEND_URL
        value: https://bside-club.netlify.app

      # Render pone un proxy adelante: sin esto todos los pedidos llegan con
      # la misma IP y el limite de login bloquearia a todos los usuarios juntos
      - key: TRUST_PROXY
        value: "1"

      # SMTP opcional: si queda vacio, el backend imprime los mails por consola
      # en vez de enviarlos (y no falla).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: MAIL_FROM
        value: B-Side Club <no-reply@bsideclub.com>
